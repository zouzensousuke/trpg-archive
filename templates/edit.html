<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>{{ inv.name }} - データ編集</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-dark text-light">
    <div class="container py-5">
        <h2 class="mb-4" style="color: #deff9a; border-left: 4px solid #deff9a; padding-left: 15px;">探索者データの編集</h2>
        <div class="card bg-secondary text-light border-0 shadow">
            <div class="card-body p-4">
                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label fw-bold">名前</label>
                        <input type="text" name="name" class="form-control bg-dark text-light border-dark" value="{{ inv.name }}" required>
                    </div>

                    <h5 class="mt-4 mb-3" style="color: #deff9a;">立ち絵URL（任意）</h5>
                    <div class="row g-2 mb-3">
                        <div class="col-md-4">
                            <label class="form-label fw-bold small">通常</label>
                            <input type="text" name="image_normal" class="form-control bg-dark text-light border-dark" value="{{ inv.image_normal }}" placeholder="https://...">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label fw-bold small">笑顔</label>
                            <input type="text" name="image_smile" class="form-control bg-dark text-light border-dark" value="{{ inv.image_smile }}" placeholder="https://...">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label fw-bold small">狂気</label>
                            <input type="text" name="image_insane" class="form-control bg-dark text-light border-dark" value="{{ inv.image_insane }}" placeholder="https://...">
                        </div>
                    </div>
                    
                    <div class="row mb-3">
                        <div class="col-md-5">
                            <label class="form-label fw-bold">職業・所属</label>
                            <input type="text" name="occupation" class="form-control bg-dark text-light border-dark" value="{{ inv.occupation }}">
                        </div>
                        <div class="col-md-2">
                            <label class="form-label fw-bold">年齢</label>
                            <input type="text" name="age" class="form-control bg-dark text-light border-dark" value="{{ inv.age }}">
                        </div>
                        <div class="col-md-5">
                            <label class="form-label fw-bold" style="color: #ff9999;">精神状態 (狂気)</label>
                            <input type="text" name="insanity_state" class="form-control bg-dark text-light border-dark" value="{{ inv.insanity_state }}" placeholder="正常、一時的狂気（幻覚）など">
                        </div>
                    </div>

                    <h5 class="mt-4 mb-3" style="color: #deff9a;">基礎ステータス（入力すると派生ステータスが自動計算されます）</h5>
                    <div class="row g-2 mb-3">
                        <div class="col-3 col-md-2"><label class="form-label fw-bold small">STR</label><input type="number" id="str" name="str_val" class="form-control bg-dark text-light border-dark calc-trigger" value="{{ inv.str_val }}"></div>
                        <div class="col-3 col-md-2"><label class="form-label fw-bold small">CON</label><input type="number" id="con" name="con_val" class="form-control bg-dark text-light border-dark calc-trigger" value="{{ inv.con_val }}"></div>
                        <div class="col-3 col-md-2"><label class="form-label fw-bold small">POW</label><input type="number" id="pow" name="pow_val" class="form-control bg-dark text-light border-dark calc-trigger" value="{{ inv.pow_val }}"></div>
                        <div class="col-3 col-md-2"><label class="form-label fw-bold small">DEX</label><input type="number" id="dex" name="dex_val" class="form-control bg-dark text-light border-dark calc-trigger" value="{{ inv.dex_val }}"></div>
                        <div class="col-3 col-md-2"><label class="form-label fw-bold small">APP</label><input type="number" id="app" name="app_val" class="form-control bg-dark text-light border-dark calc-trigger" value="{{ inv.app_val }}"></div>
                        <div class="col-3 col-md-2"><label class="form-label fw-bold small">SIZ</label><input type="number" id="siz" name="siz_val" class="form-control bg-dark text-light border-dark calc-trigger" value="{{ inv.siz_val }}"></div>
                        <div class="col-3 col-md-2"><label class="form-label fw-bold small">INT</label><input type="number" id="int" name="int_val" class="form-control bg-dark text-light border-dark calc-trigger" value="{{ inv.int_val }}"></div>
                        <div class="col-3 col-md-2"><label class="form-label fw-bold small">EDU</label><input type="number" id="edu" name="edu_val" class="form-control bg-dark text-light border-dark calc-trigger" value="{{ inv.edu_val }}"></div>
                    </div>

                    <h5 class="mt-4 mb-3" style="color: #deff9a;">派生ステータス & 技能ポイント（自動計算）</h5>
                    <div class="row g-2 mb-4">
                        <div class="col-3 col-md-2"><label class="form-label fw-bold small">HP</label><input type="number" id="hp" name="hp_val" class="form-control bg-dark text-light border-dark" value="{{ inv.hp_val }}"></div>
                        <div class="col-3 col-md-2"><label class="form-label fw-bold small">MP</label><input type="number" id="mp" name="mp_val" class="form-control bg-dark text-light border-dark" value="{{ inv.mp_val }}"></div>
                        <div class="col-3 col-md-2"><label class="form-label fw-bold small">SAN</label><input type="number" id="san" name="san_val" class="form-control bg-dark text-light border-dark" value="{{ inv.san_val }}"></div>
                        <div class="col-3 col-md-2"><label class="form-label fw-bold small">アイデア</label><input type="number" id="idea" name="idea_val" class="form-control bg-dark text-light border-dark" value="{{ inv.idea_val }}"></div>
                        <div class="col-3 col-md-2"><label class="form-label fw-bold small">知識</label><input type="number" id="know" name="know_val" class="form-control bg-dark text-light border-dark" value="{{ inv.know_val }}"></div>
                        <div class="col-3 col-md-2"><label class="form-label fw-bold small">幸運</label><input type="number" id="luck" name="luck_val" class="form-control bg-dark text-light border-dark" value="{{ inv.luck_val }}"></div>
                        <div class="col-6 col-md-3"><label class="form-label fw-bold small">ダメージボーナス(DB)</label><input type="text" id="db" name="db_val" class="form-control bg-dark text-light border-dark" value="{{ inv.db_val }}"></div>
                        
                        <div class="col-6 col-md-4">
                            <div class="p-2 bg-dark border border-secondary rounded h-100 d-flex flex-column justify-content-center">
                                <div class="fw-bold small" style="color: #deff9a;">職業技能ポイント (EDU×20)</div>
                                <div class="fs-5 fw-bold text-light" id="occ_pt">0</div>
                            </div>
                        </div>
                        <div class="col-6 col-md-4">
                            <div class="p-2 bg-dark border border-secondary rounded h-100 d-flex flex-column justify-content-center">
                                <div class="fw-bold small" style="color: #deff9a;">趣味技能ポイント (INT×10)</div>
                                <div class="fs-5 fw-bold text-light" id="int_pt">0</div>
                            </div>
                        </div>
                    </div>

                    <h5 class="mt-5 mb-3" style="color: #deff9a;">習得技能の編集</h5>
                    <div class="row g-2 mb-4">
                        {% for name, val in skills.items() %}
                        <div class="col-4 col-md-3 col-lg-2">
                            <label class="form-label fw-bold small text-truncate d-block mb-1" style="color: #ccc;">{{ name }}</label>
                            <input type="number" name="skill_{{ name }}" class="form-control bg-dark text-light border-dark form-control-sm" value="{{ val }}">
                        </div>
                        {% endfor %}
                    </div>

                    <div class="mb-4">
                        <label class="form-label fw-bold">背景・メモ・全データログ</label>
                        <textarea name="memo" class="form-control bg-dark text-light border-dark" rows="12">{{ inv.memo }}</textarea>
                    </div>

                    <div class="d-flex justify-content-between">
                        <a href="/investigator/{{ inv.id }}" class="btn btn-outline-light fw-bold">キャンセル</a>
                        <button type="submit" class="btn fw-bold" style="background-color: #deff9a; color: #000;">変更を保存</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script>
        function calculateStats() {
            const str = parseInt(document.getElementById('str').value) || 0;
            const con = parseInt(document.getElementById('con').value) || 0;
            const pow = parseInt(document.getElementById('pow').value) || 0;
            const siz = parseInt(document.getElementById('siz').value) || 0;
            const int = parseInt(document.getElementById('int').value) || 0;
            const edu = parseInt(document.getElementById('edu').value) || 0;

            // CoC6版の厳密な計算ルール
            document.getElementById('hp').value = Math.ceil((con + siz) / 2);
            document.getElementById('mp').value = pow; // POW x 1
            document.getElementById('idea').value = int * 5;
            document.getElementById('know').value = edu * 5;
            document.getElementById('luck').value = pow * 5;
            
            // SAN値（POW x 5）
            if (document.getElementById('san').value == 0 || document.getElementById('san').value == (pow*5)) {
                document.getElementById('san').value = pow * 5;
            }

            // 技能ポイントの表示
            document.getElementById('occ_pt').innerText = edu * 20;
            document.getElementById('int_pt').innerText = int * 10;

            // ダメージボーナス(DB)の計算
            const str_siz = str + siz;
            let db_val = "0";
            if (str_siz >= 2 && str_siz <= 12) db_val = "-1D6";
            else if (str_siz >= 13 && str_siz <= 16) db_val = "-1D4";
            else if (str_siz >= 17 && str_siz <= 24) db_val = "+0";
            else if (str_siz >= 25 && str_siz <= 32) db_val = "+1D4";
            else if (str_siz >= 33 && str_siz <= 40) db_val = "+1D6";
            document.getElementById('db').value = db_val;
        }

        document.querySelectorAll('.calc-trigger').forEach(input => {
            input.addEventListener('input', calculateStats);
        });

        // 画面読み込み時に一度計算を実行
        calculateStats();
    </script>
</body>
</html>
