<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>テキストから自動生成</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-dark text-light">
    <div class="container py-5">
        <h2 class="mb-4" style="color: #deff9a; border-left: 4px solid #deff9a; padding-left: 15px;">探索者データ 自動インポート</h2>
        <p class="text-muted mb-4">キャラクターシートから出力したテキストデータをそのまま貼り付けてください。ステータスを自動で解析して登録します。</p>
        
        <div class="card bg-secondary text-light border-0 shadow">
            <div class="card-body p-4">
                <form method="POST">
                    <div class="mb-4">
                        <textarea name="raw_text" class="form-control bg-dark text-light border-dark" rows="15" placeholder="ここにテキストをペースト..." required></textarea>
                    </div>
                    <div class="d-flex justify-content-between">
                        <a href="/" class="btn btn-outline-light fw-bold">キャンセル</a>
                        <button type="submit" class="btn fw-bold" style="background-color: #deff9a; color: #000;">データを解析して登録</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
