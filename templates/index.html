<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>探索者アーカイブ</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .portrait { width: 100%; height: 200px; object-fit: cover; object-position: top; border-radius: 5px; }
        .card-hover { transition: transform 0.2s; }
        .card-hover:hover { transform: translateY(-5px); }
    </style>
</head>
<body class="bg-dark text-light">
    <div class="container py-5">
        
        <form action="/party" method="GET">
            
            <div class="d-flex justify-content-between align-items-center mb-4 border-bottom border-secondary pb-3">
                <h1 class="fw-bold mb-0" style="color: #deff9a; text-shadow: 0 0 10px rgba(222,255,154,0.3);">探索者アーカイブ</h1>
                <div>
                    <button type="submit" class="btn btn-outline-warning fw-bold me-2">KPダッシュボード起動</button>
                    <a href="/import" class="btn fw-bold" style="background-color: #deff9a; color: #000;">＋ 新規データ取込</a>
                </div>
            </div>

            <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 row-cols-xl-4 g-4">
                {% for inv in invs %}
                <div class="col">
                    <div class="card bg-secondary text-light border-0 shadow h-100 card-hover position-relative">
                        
                        <div class="position-absolute top-0 start-0 m-2" style="z-index: 10;">
                            <input class="form-check-input border-dark shadow" type="checkbox" name="id" value="{{ inv.id }}" style="width: 1.5rem; height: 1.5rem; cursor: pointer;">
                        </div>

                        <a href="/investigator/{{ inv.id }}" class="text-decoration-none text-light d-block h-100">
                            <div class="card-body text-center p-3">
                                {% if inv.image_normal %}
                                    <img src="{{ inv.image_normal }}" class="portrait mb-3 border border-dark">
                                {% else %}
                                    <div class="portrait mb-3 bg-dark d-flex align-items-center justify-content-center text-muted border border-dark">NO IMAGE</div>
                                {% endif %}
                                <h5 class="fw-bold mb-1" style="color: #deff9a;">{{ inv.name }}</h5>
                                <div class="small text-muted mb-2">{{ inv.occupation }}</div>
                                <div class="d-flex justify-content-center gap-2">
                                    <span class="badge bg-dark border border-secondary text-light">HP {{ inv.hp_val }}</span>
                                    <span class="badge bg-dark border border-secondary text-light">MP {{ inv.mp_val }}</span>
                                    <span class="badge" style="background-color: #deff9a; color: #000;">SAN {{ inv.san_val }}</span>
                                </div>
                            </div>
                        </a>
                    </div>
                </div>
                {% else %}
                <div class="col-12 text-center text-muted mt-5">
                    <p>まだ探索者データがありません。「＋ 新規データ取込」から追加してください。</p>
                </div>
                {% endfor %}
            </div>
            
        </form>

    </div>
</body>
</html>
